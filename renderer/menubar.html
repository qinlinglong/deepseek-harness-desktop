<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%;
    }
    #ico {
      box-sizing: border-box;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      /* 与系统深色菜单栏同色同质感，紧贴菜单栏下沿，视觉即菜单栏延伸出的图标 */
      background: #2b2b2e;
      cursor: default; user-select: none;
    }
    #ico:hover { background: #3a3a3f; }
    #ico:active { background: #232326; }
    #ico img {
      width: 15px; height: 15px; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="ico"><img id="img" alt="" /></div>
  <script>
    // 副屏菜单栏图标：贴顶小窗口，形态对齐托盘图标。
    // 左键=打开主窗口（与托盘一致），右键=弹出与应用托盘相同的菜单。
    window.menuBar.onIcon((dataUrl) => {
      if (dataUrl) document.getElementById('img').src = dataUrl
    })
    window.addEventListener('contextmenu', (e) => e.preventDefault())
    window.addEventListener('mousedown', (e) => {
      if (e.button === 0) window.menuBar.click()
      else if (e.button === 2) window.menuBar.openMenu({ x: e.screenX, y: e.screenY })
    })
  </script>
</body>
</html>
